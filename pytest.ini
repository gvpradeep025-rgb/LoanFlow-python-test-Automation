[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    unit: unit tests for validators, models and services
    api: tests for the LoanFlow HTTP API and API client
    database: tests for the SQLite repository and database layer
    integration: tests combining service, API and database layers
    mutation: mutation testing exercises that are excluded from the default suite
    slow: tests marked slow

python_files = test_*.py
python_classes = Test*
python_functions = test_*
